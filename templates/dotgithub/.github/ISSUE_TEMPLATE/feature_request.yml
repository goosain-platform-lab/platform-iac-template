name: Feature request
description: Suggest a change or an addition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who needs it, and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you suggest?
    validations:
      required: true
